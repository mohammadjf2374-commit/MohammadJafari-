const GZ={y:CY,e:0,cp:0},fy=y=>fa(y).replace(/٬/g,''),gzYs=()=>[...new Set([CY,CY-1,...db.gzy,...db.gz.map(e=>e.y)])].sort((a,b)=>b-a),
gzDK=()=>(db.gzc.find(c=>c.t=='date')||{}).k,
gzL=(y=GZ.y)=>db.gz.filter(e=>e.y==y).sort((a,b)=>(norm(a[gzDK()])||'9').localeCompare(norm(b[gzDK()])||'9')||a.id-b.id),
gzS=(c,e)=>c.t=='date'?pd(e[c.k]||''):esc(e[c.k]||''),
gzIn=(c,e,at)=>c.t=='date'?`<input readonly placeholder="تاریخ" value="${esc(pd((e||{})[c.k]||''))}" onclick="dp(this)" ${at}>`:c.t=='apt'?`<select ${at}><option></option>${['سرد','گرم'].map(o=>`<option ${o==(e||{})[c.k]?'selected':''}>${o}</option>`).join('')}</select>`:`<input value="${esc((e||{})[c.k]||'')}" ${at}>`;
function gzT(){gzI();const A=isA(),L=gzL(),C=db.gzc,E=A&&GZ.e;
$('#gz').innerHTML=`${GZ.all?'<div class="card np"><button class="b" onclick="GZ.all=0;gzT()">✔ بازگشت به نمای عادی (نمایش همه‌ی سال‌ها فعال است)</button></div>':''}<div class="card np"><b>گزارش</b><div style="margin:8px 0">${gzYs().map(y=>`<button class="b ${y==GZ.y?'':'s'}" style="margin:0 0 4px 6px" onclick="GZ.y=${y};gzT()">${fy(y)}</button>`).join('')}${A?`<button class="b s" style="margin:0 0 4px 6px" onclick="gzYear()">+ سال جدید</button>`:''}</div>
<button class="b" onclick="gzPdf()">PDF سال ${fy(GZ.y)}</button><button class="b" onclick="gzPdfAll()">PDF همه سال‌ها (یکجا)</button><button class="b s" onclick="gzX()">خروجی Excel</button>${A?`<button class="b ${E?'':'s'}" onclick="GZ.e=!GZ.e;gzT()">${E?'✔ پایان ویرایش':'✏️ ویرایش ردیف‌ها'}</button><button class="b s" onclick="GZ.cp=!GZ.cp;gzT()">🗂 ستون‌ها</button>`:''}</div>
${A&&GZ.cp?`<div class="card np"><b>ستون‌های گزارش</b>${C.map((c,i)=>`<div class="rpr"><span>${esc(c.label)}</span><span><button onclick="gzCe(${i})">✏️</button><button onclick="gzCd(${i})">🗑️</button></span></div>`).join('')}<div class="rda" onclick="gzCa()">+ افزودن ستون</div></div>`:''}
${A?`<div class="card np"><b>افزودن مورد جدید به گزارش ${fy(GZ.y)}</b><div class="f">${C.map(c=>`<div><label>${esc(c.label)}</label>${gzIn(c,null,`id="g_${c.k}"`)}</div>`).join('')}</div><button class="b" onclick="gzAdd()">افزودن</button></div>`:''}
${GZ.all?gzYs().slice().reverse().map(y=>gzSec(y,0)).join(''):gzSec(GZ.y,E)}`}
function gzSec(y,E){const L=gzL(y),C=db.gzc;return `<div class="card gzy"><b>${db.brand?esc(db.brand)+' — ':''}گزارش سال ${fy(y)}</b> <span style="color:var(--mut);font-size:12px">(${fa(L.length)} مورد)</span><div class="tw">${L.length?`<table class="gzt"><thead><tr><th>ردیف</th>${C.map(c=>`<th>${esc(c.label)}</th>`).join('')}${E?'<th class="np"></th>':''}</tr></thead><tbody>${L.map((e,i)=>`<tr><td>${fa(i+1)}</td>${C.map(c=>`<td>${E?gzIn(c,e,`onchange="gzV(${e.id},'${c.k}',this.value)"`):gzS(c,e)}</td>`).join('')}${E?`<td class="np"><button class="b d" onclick="gzDel(${e.id})">حذف</button></td>`:''}</tr>`).join('')}</tbody></table>`:'<div class="empty">برای این سال موردی ثبت نشده است.</div>'}</div></div>`}
function gzAdd(){const e={id:Date.now(),y:GZ.y},dk=gzDK();db.gzc.forEach(c=>{const v=$('#g_'+c.k).value.trim();e[c.k]=c.t=='date'?norm(v):v});
if(!db.gzc.some(c=>e[c.k]))return alert('حداقل یک فیلد را پر کنید.');
const m=String(e[dk]||'').match(/^(\d{4})\//);if(m)e.y=+m[1];GZ.y=e.y;db.gz.push(e);lg('افزودن به گزارش');save();gzT()}
function gzV(id,k,v){const e=db.gz.find(q=>q.id==id);if(!e)return;const c=db.gzc.find(x=>x.k==k)||{};e[k]=c.t=='date'?norm(v):v.trim();
lg('ویرایش گزارش');save();if(c.t=='date'){const m=e[k].match(/^(\d{4})\//);if(m&&+m[1]!=e.y){e.y=+m[1];GZ.y=e.y;save()}gzT()}}
function gzDel(id){if(confirm('این مورد حذف شود؟')){db.gz=db.gz.filter(e=>e.id!=id);lg('حذف از گزارش');save();gzT()}}
function gzYear(){const y=+norm(prompt('سال جدید (مثلاً 1406):'));if(!y||y<1300||y>1700)return;if(!db.gzy.includes(y))db.gzy.push(y);GZ.y=y;save();gzT()}
function gzCa(){const n=(prompt('نام ستون جدید:')||'').trim();if(!n)return;db.gzc.push({k:'c'+Date.now(),label:n});save();gzT()}
function gzCe(i){const c=db.gzc[i],n=prompt('نام ستون',c.label);if(n&&n.trim()){c.label=n.trim();save();gzT()}}
function gzCd(i){const c=db.gzc[i];if(confirm('ستون «'+c.label+'» حذف شود؟ (داده‌های ثبت‌شده نگه داشته می‌شود)')){db.gzc.splice(i,1);save();gzT()}}
function gzPdf(){GZ.e=0;GZ.cp=0;gzT();setTimeout(doPrint,100)}
function gzPdfAll(){GZ.e=0;GZ.cp=0;GZ.all=1;gzT();setTimeout(doPrint,100)}
onafterprint=()=>{if(GZ.all){GZ.all=0;if(tab=='gz')gzT()}};
function gzX(){const C=db.gzc;csv([['ردیف',...C.map(c=>c.label)],...gzL().map((e,i)=>[i+1,...C.map(c=>e[c.k]||'')])],'report-'+GZ.y)}
// ---------- ورود ----------
function login(){const x=db.users.find(v=>v.u==$('#lu').value.trim()&&v.p==h($('#lp').value));if(!x)return alert('نام کاربری یا رمز اشتباه است.');me=x;SS.s('cvme',JSON.stringify(x));start()}
function logout(){SS.d('cvme');me=null;start()}
function start(){$('#brand').textContent=$('#bf').textContent=db.brand;$('#bsep').style.display=db.brand?'':'none';$('#hu').innerHTML=me?`${esc(me.name||me.u)} (${me.role=='admin'?'مدیر':'کاربر'}) <button class="b s" style="padding:3px 10px;margin:0" onclick="logout()">خروج</button>`:'';
if(!me){$('#nav').innerHTML='';$('#app').innerHTML='<div class="card login"><b>ورود به سامانه</b><label>نام کاربری</label><input id="lu"><label>رمز عبور</label><input id="lp" type="password" onkeydown="if(event.key==\'Enter\')login()"><button class="b" onclick="login()">ورود</button></div>'}else go('dash')}
start();

</script>
</body>
</html>
